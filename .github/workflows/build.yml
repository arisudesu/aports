name: Build packages

on:
  push:
    branches:
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout aports"
        uses: actions/checkout@v4
        with:
          path: aports

      - name: "Checkout packages"
        uses: actions/checkout@v4
        with:
          ref: packages
          path: packages

      - name: "Build packages"
        run: |
          echo "${{ secrets.PACKAGER_PRIVKEY }}" > signing_key.rsa
          echo "${{ secrets.PACKAGER_PRIVKEY_PUB }}" > signing_key.rsa.pub

          cd aports

          export ABUILD_GID=$(id -g)
          export ABUILD_UID=$(id -u)
          export HOST_PACKAGES_DIR=../packages
          export HOST_SIGNING_KEY_PATH=../signing_key.rsa
          export HOST_SIGNING_PUBKEY_PATH=../signing_key.rsa.pub
          export SIGNING_KEY_NAME=arisudesu@users.noreply.github.com-66758c7b

          while read repo; do
            docker compose run --build abuild $repo
          done < .repositories

      - name: "Commit packages"
        run: |
          cd packages
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add .
          git diff-index --quiet HEAD && exit 0
          git commit -am "Updated packages from ${{ github.sha }}"
          git push origin packages
